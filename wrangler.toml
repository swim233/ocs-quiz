name = "ocs-quiz"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# React 前端静态资源 (npm run build:web 后生成)
[assets]
directory = "./dist"
binding = "ASSETS"

# LLM 的 apiKey / baseUrl / model 由调用方随请求携带 (BYOK), 服务端不保存
[vars]
LLM_TEMPERATURE = "0"
LLM_TIMEOUT_MS = "110000"
VISION_ENABLED = "true"
LOG_ENABLED = "true"

# AUTH_TOKEN (搜题请求鉴权) 与 WEBUI_TOKEN (日志页鉴权) 为敏感信息,
# 分别通过 `wrangler secret put AUTH_TOKEN` / `wrangler secret put WEBUI_TOKEN` 配置, 不要写入本文件

[[d1_databases]]
binding = "DB"
database_name = "ocs-quiz-db"
# 创建数据库: wrangler d1 create ocs-quiz-db, 然后将输出的 database_id 填入此处
database_id = "b38b1e17-777e-43ab-85d1-7b395e7cda30"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

